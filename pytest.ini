[pytest]
# Tell pytest-django which settings module initializes the portal.
DJANGO_SETTINGS_MODULE = portal_config.settings
# Add the Django project directory so app modules can be imported during collection.
pythonpath = web_portal
# Restrict discovery to the Django apps that currently contain portal tests.
testpaths = web_portal/accounts web_portal/patents
# Recognize Django's tests.py files and the common pytest filename patterns.
python_files = tests.py test_*.py *_tests.py
# Show extra test summary details and reject misspelled/unregistered markers.
addopts = -ra --strict-markers



#This block of code is a pytest.ini configuration file designed to integrate pytest smoothly with a Django web application.
#Without this file, pytest wouldn't understand how to interact with Django's database, settings, or project structure, causing your tests to crash with import
#errors.
#Here is the breakdown of what each line does:

#1. [pytest]

#• This is the section header. It tells the configuration parser that all the settings below this line belong exclusively to pytest.

#2. DJANGO_SETTINGS_MODULE = portal_config.settings

#• What it does: Points pytest to your Django settings file.
#• Why it matters: Python frameworks need to know their settings (database credentials, installed apps, middleware) before they can boot up. 
#This line ensures pytest-django initializes your application correctly using the settings file located at web_portal/portal_config/settings.py.

#3. pythonpath = web_portal

#• What it does: Dynamically adds the web_portal directory to Python's search path (sys.path) during testing.
#• Why it matters: It prevents ModuleNotFoundError crashes. It allows pytest to easily run statements like from accounts.models 
#import User instead of forcing you to use messy absolute imports like from web_portal.accounts.models import User.

#4. testpaths = web_portal/accounts web_portal/patents

#• What it does: Explicitly restricts test discovery to just these two specific folders.
#• Why it matters: Efficiency. Instead of scanning your entire project directory (including graph, ingestion, services, or massive __pycache__ folders), 
#pytest will head straight to your accounts and patents apps, making the test suite start up much faster.

#5. python_files = tests.py test_*.py *_tests.py

#• What it does: Expands the list of filenames pytest recognizes as test files.
#• Why it matters: Standard pytest only looks for files starting with test_ or ending with _test. However, standard Django apps 
#use a single file named tests.py. Adding tests.py here bridges the gap, allowing pytest to catch legacy Django test files alongside modern pytest files.

#6. addopts = -ra --strict-markers

#• What it does: Automatically appends these two command-line flags every single time you type pytest.
#	• -ra: (Report All) Displays a detailed summary at the end of the test run for everything except passing tests (it will explicitly show reasons for skipped,
# failed, xfailed, and xpassed tests).
#	• --strict-markers: Forces pytest to trigger an immediate error if you use a custom decorator/tag (like @pytest.mark.datainf) that hasn't been 
#explicitly registered in this configuration file. This prevents minor typos (like typing @pytest.mark.solw instead of slow) from silently ignoring tests.
