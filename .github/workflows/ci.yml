name: CI

# Run checks for pull requests and updates to main; also allow manual and reusable runs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Give workflow jobs read-only access to repository contents.
permissions:
  contents: read

jobs:
  # Build the React frontend to catch dependency and production-build errors.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_portal/frontend/package-lock.json
      - run: npm ci
        working-directory: web_portal/frontend
      - run: npm run build
        working-directory: web_portal/frontend

  # Install Python dependencies, validate Django/Python configuration, and run pytest.
  backend:
    name: Django and Python checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py config graph ingestion services web_portal
      - name: Check Django configuration
        run: python web_portal/manage.py check
      - name: Run portal tests
        run: pytest
      # Parse deployment scripts without changing or executing the production VM.
      - name: Check deployment shell script syntax
        run: |
          bash -n deployment/civo/setup-vm.sh
          bash -n deployment/civo/deploy-release.sh

  # Use Windows PowerShell to parse the Windows-only data preparation script.
  powershell:
    name: PowerShell script syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse data preparation script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "deployment/civo/prepare-data.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

